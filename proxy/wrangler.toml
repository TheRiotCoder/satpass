# Cloudflare Worker for SatPass. Deploy:  cd proxy && npx wrangler deploy      (see README.md)
name = "satpass-proxy"
main = "worker.js"
compatibility_date = "2024-09-01"

[vars]
# Browser origins allowed to call this proxy (comma separated, exact match, no trailing slash).
ALLOWED_ORIGINS = "https://theriotcoder.github.io"
